name: Test e immagine Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/uhppote-desk

jobs:
  test:
    name: Typecheck e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:int

  image:
    name: Build e pubblicazione immagine
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build (per lo smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: uhppote-desk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del container
        run: |
          docker run -d --name smoke --network host \
            -e HTTP_PORT=8080 -e INITIAL_ADMIN_PASSWORD=smoke-test-pass uhppote-desk:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec smoke node hwtest/cli.js --help > /dev/null
          docker logs smoke

      - name: Log del container in caso di errore
        if: failure()
        run: docker logs smoke || true

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Login a GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblicazione
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
