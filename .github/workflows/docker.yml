name: Tests and Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to release from the selected branch (e.g. 1.0.0): creates the v<version> tag, the GitHub release and the version tags of the image. Leave empty for a normal build.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/uhppote-desk

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:int

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # arm64 (Raspberry Pi, ARM NAS) besides amd64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: uhppote-desk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test (named volume)
        run: |
          docker run -d --name smoke --network host \
            -e HTTP_PORT=8080 -e ADMIN_PASSWORD=smoke-test-pass uhppote-desk:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec smoke node hwtest/cli.js --help > /dev/null
          docker logs smoke 2>&1 | grep -q 'creating a new one'
          # ADMIN_PASSWORD set: login works and no password change is required
          docker logs smoke 2>&1 | grep -q "Created user 'admin' with the password from ADMIN_PASSWORD"
          curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"smoke-test-pass"}' \
            http://127.0.0.1:8080/api/auth/login | grep -q '"mustChangePassword":false'
          docker rm -f smoke

      - name: Host bind mounts (missing folder, folder owned by another user, non-writable)
        run: |
          set -e
          wait_health() {
            for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$1/api/health" > /dev/null && return 0; sleep 1; done
            return 1
          }

          # A) host folder that does not exist yet (Docker creates it as root)
          docker run -d --name bindA --network host -e HTTP_PORT=8081 -e UHPPOTE_LISTEN=0.0.0.0:60051 \
            -v "$RUNNER_TEMP/bind-a:/data" uhppote-desk:ci
          wait_health 8081 || { docker logs bindA; exit 1; }
          test -f "$RUNNER_TEMP/bind-a/uhppote-desk.sqlite"
          docker logs bindA 2>&1 | grep -q 'creating a new one'
          # ADMIN_PASSWORD not set: a temporary password is generated and printed
          docker logs bindA 2>&1 | grep -q "Created user 'admin' with temporary password"
          # restart with ADMIN_PASSWORD on the existing database: the password is applied
          docker rm -f bindA
          docker run -d --name bindA --network host -e HTTP_PORT=8081 -e UHPPOTE_LISTEN=0.0.0.0:60051 -e ADMIN_PASSWORD=set-later-pass \
            -v "$RUNNER_TEMP/bind-a:/data" uhppote-desk:ci
          wait_health 8081 || { docker logs bindA; exit 1; }
          docker logs bindA 2>&1 | grep -q "Password of user 'admin' set from ADMIN_PASSWORD"
          curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"set-later-pass"}' http://127.0.0.1:8081/api/auth/login > /dev/null
          # restart: the existing database is reused
          docker restart bindA && wait_health 8081 && docker logs bindA 2>&1 | grep -q 'using database'
          docker rm -f bindA

          # B) existing host folder owned by the runner user, custom PUID/PGID
          mkdir -p "$RUNNER_TEMP/bind-b"
          docker run -d --name bindB --network host -e HTTP_PORT=8082 -e UHPPOTE_LISTEN=0.0.0.0:60052 \
            -e PUID=1234 -e PGID=1234 -v "$RUNNER_TEMP/bind-b:/data" uhppote-desk:ci
          wait_health 8082 || { docker logs bindB; exit 1; }
          test "$(stat -c '%u:%g' "$RUNNER_TEMP/bind-b/uhppote-desk.sqlite")" = "1234:1234"
          docker rm -f bindB

          # C) started as a non-root user on a folder it cannot write: clear error message
          sudo mkdir -p "$RUNNER_TEMP/bind-c" && sudo chown root:root "$RUNNER_TEMP/bind-c" && sudo chmod 755 "$RUNNER_TEMP/bind-c"
          docker run --name bindC --network host --user 1000:1000 -e HTTP_PORT=8083 -e UHPPOTE_LISTEN=0.0.0.0:60053 \
            -v "$RUNNER_TEMP/bind-c:/data" uhppote-desk:ci || true
          docker logs bindC 2>&1 | tee /dev/stderr | grep -q 'is not writable by the process'
          docker rm -f bindC

      - name: Home Assistant add-on (options file, no Supervisor)
        run: |
          set -e
          # the add-on is built on the image just tested, with the local docker builder
          docker build --builder default --build-arg BUILD_FROM=uhppote-desk:ci --build-arg BUILD_VERSION=ci \
            -t uhppote-desk-addon:ci homeassistant-addon
          mkdir -p "$RUNNER_TEMP/addon"
          echo '{"admin_password":"addon-pass","mqtt_enabled":true,"mqtt_door_control":true,"mqtt_language":"en","log_level":"info"}' \
            > "$RUNNER_TEMP/addon/options.json"
          docker run -d --name addon --network host -v "$RUNNER_TEMP/addon:/data" uhppote-desk-addon:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/health
          docker logs addon 2>&1 | grep -q 'add-on: web interface on port 8080'
          curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"addon-pass"}' \
            http://127.0.0.1:8080/api/auth/login > /dev/null
          docker rm -f addon

      - name: Container log on failure
        if: failure()
        run: for c in smoke bindA bindB bindC addon; do docker logs $c 2>/dev/null || true; done

      - name: Release version
        id: ver
        env:
          INPUT: ${{ inputs.release }}
        run: |
          v="$INPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$v" ]; then
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $v"; exit 1; }
            pkg=$(node -p "require('./package.json').version")
            [ "$pkg" = "$v" ] || { echo "package.json has version $pkg, not $v"; exit 1; }
            grep -q "^version: \"$v\"" homeassistant-addon/config.yaml || { echo "homeassistant-addon/config.yaml is not at version $v"; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
            echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.version != '' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Home Assistant add-on (homeassistant-addon/config.yaml): one image per architecture, only for releases
      - name: Publish the Home Assistant add-on (amd64)
        if: github.event_name != 'pull_request' && steps.ver.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: homeassistant-addon
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_FROM=${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            BUILD_ARCH=amd64
          tags: ghcr.io/${{ github.repository_owner }}/amd64-uhppote-desk-addon:${{ steps.ver.outputs.version }}

      - name: Publish the Home Assistant add-on (aarch64)
        if: github.event_name != 'pull_request' && steps.ver.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: homeassistant-addon
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_FROM=${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            BUILD_ARCH=aarch64
          tags: ghcr.io/${{ github.repository_owner }}/aarch64-uhppote-desk-addon:${{ steps.ver.outputs.version }}

  release:
    name: GitHub release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release) }}
    steps:
      - uses: actions/checkout@v5

      - name: Release notes from CHANGELOG.md
        run: |
          .github/scripts/release-notes.sh "${TAG#v}" > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # on a manual release the tag does not exist yet: it is created on the built commit
          gh release create "$TAG" --target "$GITHUB_SHA" --title "UHPPOTE Desk $TAG" --notes-file notes.md \
            "docs/UHPPOTE-Desk-Manual.pdf#User manual (PDF)"
