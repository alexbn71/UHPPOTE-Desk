name: Update release notes

# Rewrites the notes of an existing GitHub release from CHANGELOG.md (e.g. after fixing the changelog),
# without rebuilding or republishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the release to update (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    name: Update the notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $VERSION"; exit 1; }
          .github/scripts/release-notes.sh "$VERSION" > notes.md
          cat notes.md

      - name: Update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "v$VERSION" --notes-file notes.md
