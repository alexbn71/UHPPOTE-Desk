# UHPPOTE Desk on a server/NAS. Full guide: docs/DOCKER.md
# IMPORTANT: network_mode "host" is required for broadcast discovery of the controllers
# and to receive the UDP events the controllers send to this host.
#
#   cp docker/.env.example docker/.env   (and edit the values)
#   docker compose -f docker/docker-compose.yml up -d

services:
  uhppote-desk:
    # image published by GitHub Actions; to build it locally add:
    #   build: { context: .., dockerfile: docker/Dockerfile }
    image: ghcr.io/alexbn71/uhppote-desk:latest
    container_name: uhppote-desk
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - uhppote-desk-data:/data

volumes:
  uhppote-desk-data:
