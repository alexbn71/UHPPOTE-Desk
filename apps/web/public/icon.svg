<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="UHPPOTE Desk">
  <title>UHPPOTE Desk</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8ae6"/>
      <stop offset="1" stop-color="#1557a8"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9fb"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- door frame -->
  <rect x="112" y="96" width="196" height="320" rx="22" fill="none" stroke="#ffffff" stroke-width="22"/>
  <!-- open door leaf -->
  <path d="M134 118 L262 146 L262 398 L134 394 Z" fill="url(#door)"/>
  <!-- handle -->
  <circle cx="238" cy="272" r="13" fill="#1557a8"/>

  <!-- RFID reader -->
  <rect x="338" y="226" width="72" height="104" rx="16" fill="#ffffff"/>
  <circle cx="374" cy="306" r="8" fill="#34c38f"/>
  <!-- RFID waves -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <path d="M354 194 a28 28 0 0 1 40 0"/>
    <path d="M336 164 a54 54 0 0 1 76 0"/>
  </g>
</svg>
